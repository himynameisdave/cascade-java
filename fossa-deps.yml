# Explicitly declared dependencies.
#
# Everything listed here is already declared in pom.xml. The duplication is
# deliberate: static pom.xml analysis reports this project's own artifact as the
# only direct dependency and puts everything it declares one level below, as
# transitive, which hides all of it from tooling that only upgrades direct
# dependencies.
#
# `referenced-dependencies` is the documented way to state "this project depends
# on these packages" independently of what a build-system analyzer infers, so
# these entries should be attributed to the project itself.
#
# Keep this list in step with pom.xml. Both are pinned older than current on
# purpose; see "Dependency upgrade backlog" in README.md.

